name: GO CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.0'

      - name: Install dependencies
        run: go mod download

      - name: Run golangci-lint      
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m
          install-mode: goinstall

      - name: Run Tests
        run: go test -v ./...

      - name: Run go vet        
        run: go vet ./...
