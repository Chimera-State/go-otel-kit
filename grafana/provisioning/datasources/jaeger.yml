apiVersion: 1

datasources:
  - name: Jaeger
    type: jaeger
    uid: jaeger-datasource
    url: http://jaeger:16686
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      tracesToLogsV2:
        enabled: false
      serviceMap:
        datasourceUid: jaeger-datasource
      nodeGraph:
        enabled: true
      traceQuery:
        timeShiftEnabled: true
        liveStreaming: false
      spanBar:
        type: None
